# user_list.html
{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2 class="my-4">Usuários Cadastrados</h2>
    
    <a href="{% url 'user_create' %}" class="btn btn-primary mb-3">
        Novo Usuário
    </a>
    
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Setor</th>
                <th>Telefone</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.full_name }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.sector.name|default:"Não definido" }}</td>
                <td>{{ user.phone|default:"Não informado" }}</td>
                <td>
                    <a href="{% url 'user_update' user.pk %}" class="btn btn-sm btn-warning">
                        Editar
                    </a>
                    <a href="{% url 'user_delete' user.pk %}" class="btn btn-sm btn-danger">
                        Excluir
                    </a>
                </td>
